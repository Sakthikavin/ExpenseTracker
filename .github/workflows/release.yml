name: Release APK

# Push a tag like "v1.0" to trigger this: builds the debug APK (same
# variant INSTALL_ON_PHONE.md has you sideload) and attaches it to a
# GitHub Release for download.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK with version tag
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/ExpenseTracker-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
